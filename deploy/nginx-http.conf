# /etc/nginx/conf.d/noteracy-http.conf — directives that must live in nginx's
# http{} context. Installed by deploy/setup.sh.

# Outer wall in front of the app's own express-rate-limit ceiling.
limit_req_zone  $binary_remote_addr  zone=noteracyzone:10m  rate=20r/s;
limit_conn_zone $binary_remote_addr  zone=noteracyconn:10m;

# The deploy webhook is hit a handful of times a day.
limit_req_zone  $binary_remote_addr  zone=noteracyhook:1m   rate=1r/s;
